owner: pulzar-net
repo: status

userAgent: pulzar-status

sites:
  - name: Console
    url: https://app.pulzr.net/
    expectedStatusCodes:
      - 200
  - name: API
    url: https://app.pulzr.net/api/v1/version
    expectedStatusCodes:
      - 200
    __dangerous__body_up: gitSha
  - name: Sign-in
    url: https://auth.pulzr.net/realms/net/.well-known/openid-configuration
    expectedStatusCodes:
      - 200
  - name: Docs
    url: https://app.pulzr.net/docs
  - name: MCP
    url: https://app.pulzr.net/.well-known/oauth-protected-resource/mcp
    expectedStatusCodes:
      - 200
  - name: Website
    url: https://pulzr.net/
  - name: Shop
    url: https://shop.pulzr.net/
  - name: MQTT broker
    check: tcp-ping
    url: mqtt.pulzr.net
    port: 8883

status-website:
  cname: status.pulzr.net
  logoUrl: https://status.pulzr.net/logo.svg
  faviconSvg: https://status.pulzr.net/logo.svg
  name: Pulzar Status
  introTitle: "**Pulzar** service status"
  introMessage: Live availability of the Pulzar console, API, sign-in, and MQTT broker. Checks run every 5 minutes.
  navbar:
    - title: Status
      href: /
    - title: Pulzar
      href: https://pulzr.net
    - title: Console
      href: https://app.pulzr.net
